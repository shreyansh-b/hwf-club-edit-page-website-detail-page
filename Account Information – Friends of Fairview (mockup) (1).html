<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<title>Account Information – Friends of Fairview (mockup)</title>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=Libre+Caslon+Text:wght@400;700&family=Public+Sans:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap"
		/>
		<style>
			:root {
				--ab: #3f51b5;
				--ad: #2f3f9a;
				--bg: #f1f2f6;
				--card: #fff;
				--tx: #212529;
				--mu: #667085;
				--ln: #e3e5ec;
				--fld: #eef0f3;
				color-scheme: light dark;
				box-sizing: border-box;
				padding-top: env(safe-area-inset-top, 0px);
				padding-bottom: env(safe-area-inset-bottom, 0px);
			}
			@media (prefers-color-scheme: dark) {
				:root:not([data-theme="light"]) {
					--bg: #14161d;
					--card: #1d2029;
					--tx: #e8eaf0;
					--mu: #9aa1b2;
					--ln: #2d3140;
					--fld: #272a36;
				}
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
			}
			body {
				background: var(--bg);
				color: var(--tx);
				font:
					13px/1.45 Roboto,
					system-ui,
					sans-serif;
			}
			.top {
				height: 46px;
				background: var(--ab);
				color: #fff;
				display: flex;
				align-items: center;
				gap: 14px;
				padding: 0 14px;
				position: sticky;
				top: 0;
				z-index: 5;
			}
			.top b {
				font-size: 12px;
			}
			.top small {
				display: block;
				font-size: 10px;
				opacity: 0.85;
			}
			.top .sp {
				flex: 1;
			}
			.pill {
				background: #ffffff26;
				border-radius: 6px;
				padding: 6px 12px;
				font-weight: 500;
			}
			.logo {
				width: 34px;
				height: 34px;
				border-radius: 50%;
				background: #fff;
				color: #a8322d;
				display: grid;
				place-items: center;
				font-weight: 700;
				font-size: 10px;
			}
			.wrap {
				display: flex;
			}
			.side {
				width: 190px;
				flex: none;
				background: var(--card);
				border-right: 1px solid var(--ln);
				min-height: calc(100vh - 46px);
				padding: 6px 0;
			}
			.side div {
				padding: 9px 14px;
				font-size: 11px;
				font-weight: 500;
				letter-spacing: 0.03em;
				text-transform: uppercase;
				color: var(--tx);
				display: flex;
				gap: 10px;
			}
			.side div:before {
				content: "";
				width: 14px;
				height: 14px;
				border-radius: 3px;
				background: var(--tx);
				opacity: 0.75;
			}
			.side .on {
				background: var(--fld);
			}
			.side .sub {
				padding-left: 38px;
				text-transform: none;
				letter-spacing: 0;
				font-size: 12px;
				color: var(--mu);
			}
			.side .sub:before {
				display: none;
			}
			.side .sub.on {
				color: var(--ab);
				font-weight: 500;
			}
			main {
				flex: 1;
				min-width: 0;
				padding: 14px 20px 40px;
			}
			.crumb {
				color: var(--mu);
				font-size: 12px;
				margin-bottom: 10px;
			}
			.crumb a {
				color: var(--ab);
			}
			.panel {
				background: var(--card);
				border-radius: 3px;
				box-shadow: 0 1px 3px #0001;
				padding: 18px 20px;
			}
			h1 {
				margin: 0 0 12px;
				color: var(--ab);
				font-weight: 500;
				font-size: 28px;
				padding-bottom: 12px;
				border-bottom: 2px solid var(--ab);
			}
			.tabs {
				display: flex;
				gap: 2px;
				margin-bottom: 14px;
				overflow: auto;
			}
			.tabs button {
				flex: 1;
				min-width: 120px;
				border: 0;
				padding: 12px;
				background: #6b6b6b;
				color: #fff;
				font: 500 12px Roboto;
				letter-spacing: 0.03em;
				text-transform: uppercase;
				cursor: pointer;
			}
			.tabs button.on {
				background: var(--ab);
			}
			h3 {
				color: var(--ab);
				font-weight: 500;
				font-size: 17px;
				margin: 22px 0 8px;
			}
			h3:first-child {
				margin-top: 0;
			}
			.g {
				display: grid;
				gap: 14px 20px;
				grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
			}
			.g.w2 {
				grid-template-columns: 2fr 1fr 1fr;
			}
			label {
				display: block;
				font-size: 12px;
				font-weight: 500;
				margin-bottom: 3px;
			}
			label i {
				color: #e53935;
				font-style: normal;
			}
			.f {
				background: none;
				border: 0;
				border-bottom: 1px solid #9aa;
				padding: 9px 6px;
				width: 100%;
				color: var(--tx);
				font: inherit;
				min-height: 34px;
			}
			.f.ro {
				background: var(--fld);
			}
			.btn {
				border: 0;
				border-radius: 3px;
				padding: 8px 14px;
				color: #fff;
				font: 500 12px Roboto;
				cursor: pointer;
				background: var(--ab);
			}
			.btn.gr {
				background: #43a047;
			}
			.btn.rd {
				background: #f44336;
			}
			.btn.ln {
				background: none;
				color: var(--ab);
				border: 1px solid var(--ab);
			}
			.note {
				font-size: 12px;
				color: var(--mu);
			}
			.row {
				display: flex;
				gap: 8px;
				align-items: center;
				flex-wrap: wrap;
			}
			.bank {
				width: 300px;
				height: 170px;
				border-radius: 10px;
				background: linear-gradient(135deg, #8d6a5a, #d9814f);
				color: #fff;
				padding: 16px;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
			}
			.tg {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 10px 0;
				border-bottom: 1px solid var(--ln);
			}
			.sw {
				width: 34px;
				height: 18px;
				border-radius: 99px;
				background: #bbb;
				position: relative;
				cursor: pointer;
				flex: none;
			}
			.sw:after {
				content: "";
				position: absolute;
				top: 2px;
				left: 2px;
				width: 14px;
				height: 14px;
				border-radius: 50%;
				background: #fff;
				transition: 0.15s;
			}
			.sw.on {
				background: var(--ab);
			}
			.sw.on:after {
				left: 18px;
			}
			.tpl {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
				gap: 14px;
			}
			.tc {
				border: 2px solid var(--ln);
				border-radius: 10px;
				overflow: hidden;
				cursor: pointer;
				background: var(--card);
			}
			.tc.on {
				border-color: var(--ab);
				box-shadow: 0 0 0 3px #3f51b533;
			}
			.tc img {
				display: block;
				width: 100%;
				aspect-ratio: 16/9;
				object-fit: cover;
			}
			.tc div {
				padding: 10px 12px;
			}
			.tc b {
				display: block;
				font-size: 14px;
			}
			.ed {
				display: grid;
				grid-template-columns: 270px 1fr;
				gap: 14px;
				margin-top: 14px;
				align-items: start;
			}
			.tools {
				border: 1px solid var(--ln);
				border-radius: 8px;
				padding: 12px;
				position: sticky;
				top: 56px;
				max-height: calc(100vh - 70px);
				overflow: auto;
			}
			.tools h4 {
				margin: 14px 0 6px;
				font-size: 12px;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				color: var(--mu);
			}
			.tools h4:first-child {
				margin-top: 0;
			}
			.im {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 5px 0;
				font-size: 12px;
			}
			.im img {
				width: 44px;
				height: 30px;
				object-fit: cover;
				border-radius: 4px;
			}
			.im span {
				flex: 1;
			}
			.im button {
				border: 1px solid var(--ln);
				background: none;
				color: var(--ab);
				border-radius: 5px;
				padding: 3px 8px;
				font-size: 11px;
				cursor: pointer;
			}
			.dots {
				display: flex;
				gap: 6px;
			}
			.dots i {
				width: 22px;
				height: 22px;
				border-radius: 50%;
				cursor: pointer;
				border: 2px solid #fff;
				box-shadow: 0 0 0 1px #0003;
			}
			.dots i.on {
				box-shadow: 0 0 0 2px var(--ab);
			}
			.seg {
				display: flex;
				background: var(--fld);
				border-radius: 7px;
				padding: 2px;
				margin-bottom: 8px;
			}
			.seg button {
				flex: 1;
				border: 0;
				background: none;
				padding: 6px;
				border-radius: 6px;
				font: 500 12px Roboto;
				color: var(--mu);
				cursor: pointer;
			}
			.seg button.on {
				background: var(--card);
				color: var(--tx);
				box-shadow: 0 1px 2px #0002;
			}
			.stage {
				background: #dfe2ea;
				border-radius: 8px;
				padding: 14px;
				overflow: auto;
				max-height: calc(100vh - 70px);
			}
			.frame {
				margin: 0 auto;
				background: #fff;
				border-radius: 6px;
				overflow: hidden;
				box-shadow: 0 6px 24px #0003;
				transition: width 0.2s;
			}
			.chrome {
				background: #e8eaef;
				padding: 7px 10px;
				font-size: 11px;
				color: #667;
				display: flex;
				gap: 5px;
				align-items: center;
			}
			.chrome i {
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: #bbb;
			}
			.chrome span {
				margin-left: 8px;
				background: #fff;
				border-radius: 99px;
				padding: 2px 12px;
			}
			.toast {
				position: fixed;
				bottom: 18px;
				left: 50%;
				transform: translateX(-50%);
				background: #212529;
				color: #fff;
				padding: 10px 18px;
				border-radius: 8px;
				opacity: 0;
				transition: 0.2s;
				pointer-events: none;
				z-index: 9;
			}
			.toast.on {
				opacity: 1;
			}
			.hide {
				display: none;
			}
			@media (max-width: 900px) {
				.side {
					display: none;
				}
				.ed {
					grid-template-columns: 1fr;
				}
				.tools {
					position: static;
					max-height: none;
				}
				.g.w2 {
					grid-template-columns: 1fr;
				}
				main {
					padding: 10px;
				}
			}
			/* ---------- site preview (Abby’s themes) ---------- */
			.site {
				--d: "Bricolage Grotesque", system-ui, sans-serif;
				--b: Figtree, system-ui, sans-serif;
				--hw: 600;
				--ink: #1c1d1a;
				--mt: #575a53;
				--ln: #e1dbd0;
				--red: #b0532d;
				--base: #faf8f4;
				--sf: #fff;
				--tn: #f0e9dd;
				--r: 20px;
				--br: 999px;
				--ey: none;
				--et: 0;
				--al: left;
				font-family: var(--b);
				color: var(--ink);
				background: var(--base);
				line-height: 1.55;
				container-type: inline-size;
			}
			.site.classic {
				--d: "Libre Caslon Text", Georgia, serif;
				--b: "Public Sans", system-ui, sans-serif;
				--hw: 400;
				--ink: #17203a;
				--mt: #4a5163;
				--ln: #d9d2c3;
				--red: #a8322d;
				--base: #f6f3ec;
				--tn: #e7ebf2;
				--r: 2px;
				--br: 2px;
				--ey: uppercase;
				--et: 0.16em;
				--al: center;
			}
			.site h1,
			.site h2,
			.site h3 {
				font-family: var(--d);
				font-weight: var(--hw);
				margin: 0;
				letter-spacing: -0.02em;
				line-height: 1.1;
			}
			.site p {
				margin: 0;
			}
			.s {
				padding: 56px 6cqw;
			}
			.s.base {
				background: var(--base);
			}
			.s.sf {
				background: var(--sf);
			}
			.s.tn {
				background: var(--tn);
			}
			.s.br {
				background: var(--brand);
				color: #fff;
				--mt: #ffffffcc;
				--ln: #fff3;
			}
			.hd {
				text-align: var(--al);
				max-width: 640px;
				margin: 0 auto 36px 0;
			}
			.classic .hd {
				margin: 0 auto 36px;
			}
			.hd h2 {
				font-size: clamp(26px, 5cqw, 38px);
			}
			.hd p {
				color: var(--mt);
				margin-top: 10px;
			}
			.ey {
				text-transform: var(--ey);
				letter-spacing: var(--et);
				font-size: 12px;
				font-weight: 600;
				color: var(--red);
				margin-bottom: 10px;
			}
			.br .ey {
				color: #f2c8a6;
			}
			.sbtn {
				display: inline-block;
				padding: 12px 22px;
				border-radius: var(--br);
				background: var(--red);
				color: #fff;
				font-weight: 600;
				font-size: 14px;
				margin: 6px 8px 0 0;
				cursor: pointer;
			}
			.sbtn.o {
				background: none;
				border: 1.5px solid currentColor;
				color: inherit;
			}
			.modern .sbtn {
				background: var(--brand);
			}
			.br .sbtn {
				background: #fff;
				color: var(--brand);
			}
			.br .sbtn.o {
				background: none;
				color: #fff;
			}
			.nav {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 14px 6cqw;
				background: var(--sf);
				border-bottom: 1px solid var(--ln);
				font-size: 13px;
			}
			.nav b {
				font-family: var(--d);
			}
			.nav span {
				color: var(--mt);
			}
			.hero {
				display: grid;
				grid-template-columns: 1.05fr 1fr;
				gap: 5cqw;
				align-items: center;
				padding: 56px 6cqw;
			}
			.hero h1 {
				font-size: clamp(32px, 6.4cqw, 60px);
			}
			.hero p.l {
				margin: 16px 0 20px;
				color: var(--mt);
				max-width: 48ch;
			}
			.hero .ph {
				aspect-ratio: 5/4;
				border-radius: var(--r);
			}
			.classic.site .hero {
				background: var(--brand);
				color: #fff;
				text-align: center;
				grid-template-columns: 1fr;
				padding: 0;
			}
			.classic .hero .tx {
				padding: 56px 6cqw 36px;
			}
			.classic .hero p.l {
				color: #ffffffcc;
				margin: 16px auto 20px;
			}
			.classic .hero .ey {
				color: #f0c3bb;
			}
			.classic .hero .sbtn {
				background: var(--red);
			}
			.classic .hero .sbtn.o {
				background: none;
			}
			.classic .hero .ph {
				aspect-ratio: 21/8;
				border-radius: 0;
			}
			.ph {
				background-size: cover;
				background-position: center;
				position: relative;
				cursor: pointer;
			}
			.ph:hover:after {
				content: "Replace image";
				position: absolute;
				right: 10px;
				bottom: 10px;
				background: #000a;
				color: #fff;
				font: 500 11px Roboto;
				padding: 5px 10px;
				border-radius: 6px;
			}
			.cols {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
				gap: 20px;
			}
			.card {
				background: var(--sf);
				border: 1px solid var(--ln);
				border-radius: var(--r);
				padding: 22px;
			}
			.s.sf .card {
				background: var(--base);
			}
			.br .card {
				background: #ffffff12;
				border-color: #ffffff24;
			}
			.card h3 {
				font-size: 19px;
				margin-bottom: 8px;
			}
			.card p {
				color: var(--mt);
				font-size: 14px;
			}
			.card .n {
				font-family: var(--d);
				font-size: 30px;
				font-weight: var(--hw);
				color: var(--red);
				margin-bottom: 6px;
			}
			.split {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 5cqw;
				align-items: center;
			}
			.split .ph {
				aspect-ratio: 4/3;
				border-radius: var(--r);
			}
			.split.rev .ph {
				order: 2;
			}
			.split p {
				color: var(--mt);
				margin-top: 12px;
			}
			.price {
				font-family: var(--d);
				font-size: 36px;
				font-weight: var(--hw);
			}
			.price small {
				font-size: 14px;
				color: var(--mt);
				font-family: var(--b);
			}
			.hol {
				display: flex;
				justify-content: space-between;
				padding: 14px 0;
				border-bottom: 1px solid var(--ln);
				gap: 12px;
			}
			.hol span {
				color: var(--mt);
			}
			.hol b {
				font-family: var(--d);
				font-weight: var(--hw);
				font-size: 18px;
			}
			.gal {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 12px;
			}
			.gal .ph {
				aspect-ratio: 1;
				border-radius: var(--r);
			}
			.q {
				font-size: 16px;
				font-style: var(--qs, normal);
			}
			.classic .q {
				font-style: italic;
			}
			.who {
				margin-top: 14px;
				font-size: 13px;
				color: var(--mt);
			}
			.map {
				aspect-ratio: 16/10;
				border-radius: var(--r);
			}
			.ft {
				padding: 36px 6cqw;
				font-size: 13px;
				text-align: var(--al);
			}
			.ft b {
				font-family: var(--d);
				font-size: 18px;
				font-weight: var(--hw);
			}
			.ft p {
				opacity: 0.8;
				margin-top: 6px;
			}
			.sync {
				position: absolute;
				margin: -26px 0 0 6cqw;
				font: 500 10px Roboto;
				background: #e8edff;
				color: #3f51b5;
				padding: 2px 7px;
				border-radius: 4px;
			}
			.frame.m .hero,
			.frame.m .split {
				grid-template-columns: 1fr;
			}
			.frame.m .gal {
				grid-template-columns: 1fr 1fr;
			}
			.frame.m .split.rev .ph {
				order: 0;
			}
			[contenteditable] {
				outline: none;
			}
			[contenteditable]:hover {
				box-shadow: 0 0 0 1px #3d6bff77;
				border-radius: 3px;
			}
			[contenteditable]:focus {
				box-shadow: 0 0 0 2px #3d6bff;
				background: #3d6bff10;
			}
		</style>
	</head>
	<body>
		<div class="top">
			<div class="logo">FOF</div>
			<div><b>Friends of Fairview First Responders Assoc.</b></div>
			<div class="sp"></div>
			<div>
				<b>#1 Flag program management</b
				><small>www.helpingwithflags.com | Version 3.5</small>
			</div>
			<div class="sp"></div>

							.map(
								([q, n, p], i) =>
									`<div class="card"><p class="q">“${e("q" + i, q)}”</p><div class="who"><b>${n}</b> · ${p}</div></div>`,
							)
							.join(
								"",
							)}</div><p class="who" style="margin-top:12px">Sample quotes. Replace with your own.</p></div>`,
					contact: () =>
						`<div class="s tn"><div class="split"><div><div class="ey">${e("ce", "Contact")}</div><h2 style="font-size:clamp(26px,4.4cqw,38px)">${e("ct", "Questions? We’re happy to help.")}</h2><p style="margin-bottom:14px">${e("cp", "Note: Please check the service map to verify we service your address.")}</p><p style="color:var(--ink);line-height:1.8"><b>Friends of Fairview</b><br>(469) 331-2520<br>SMS: (972) 968-8140. Text us, it’s faster and easier.<br>510 State HWY 5, Fairview, TX 75069<br>info@friendsoffairview.org</p></div>${ph("map", "map")}</div><p class="who" style="margin-top:12px;text-align:center">Friends of Fairview’s service area is highlighted in red.</p></div>`,
				};
			}
			function render() {
				const m = S.tpl == "modern",
					b = S.brand[S.tpl],
					f = secs(m);
				$("#site").className = "site " + S.tpl;
				$("#site").style.setProperty("--brand", b);
				$("#site").innerHTML =
					`<div class="nav"><b>${e("nb", "Friends of Fairview")}</b><span>Already subscribed? <u>Log in, no password needed</u></span></div>` +
					SECS.filter(([k]) => !S.hid[k])
						.map(([k]) => {
							const h = f[k]();
							return k == "hero" || h.startsWith('<div class="s')
								? h
								: `<div class="s base">${h}</div>`;
						})
						.join("") +
					`<div class="ft s br" style="padding:36px 6cqw"><b>Friends of Fairview Fire Fighters Association</b><p>info@friendsoffairview.org · (469) 331-2520</p><p>Privacy policy · Terms of service · Recurring billing & cancellation · Donation refund policy</p><p>© 2026 Friends of Fairview · Powered by Helping With Flags</p></div>`;
				$("#site")
					.querySelectorAll("[data-img]")
					.forEach((el) => (el.onclick = () => pick(el.dataset.img)));
				$("#site")
					.querySelectorAll("[data-k]")
					.forEach(
						(el) =>
							(el.oninput = () => {
								S.T[el.dataset.k] = el.innerText;
							}),
					);
				panel();
			}
			let pk = null;
			const pick = (k) => {
				pk = k;
				$("#fi").click();
			};
			$("#fi").onchange = (ev) => {
				const f = ev.target.files[0];
				if (!f) return;
				const r = new FileReader();
				r.onload = () => {
					IMG[pk] = r.result;
					render();
					toast("Image replaced");
				};
				r.readAsDataURL(f);
				ev.target.value = "";
			};
			function panel() {
				const m = S.tpl == "modern";
				$("#tools").innerHTML =
					`<h4>Device</h4><div class="seg"><button class="${S.dev == "d" ? "on" : ""}" onclick="S.dev='d';frame()">Desktop</button><button class="${S.dev == "m" ? "on" : ""}" onclick="S.dev='m';frame()">Mobile</button></div>
<h4>Brand color</h4><div class="dots">${(m ? ["#1f4e79", "#2f5d50", "#7a3b2e", "#2b2b33"] : ["#1b2a4e", "#5e1f24", "#1f3b2c", "#2b2b2f"]).map((c) => `<i class="${S.brand[S.tpl] == c ? "on" : ""}" style="background:${c}" onclick="S.brand[S.tpl]='${c}';render()"></i>`).join("")}</div>
<h4>Sections</h4>${SECS.map(([k, l]) => `<div class="tg" style="padding:6px 0"><div class="sw ${S.hid[k] ? "" : "on"}" onclick="S.hid['${k}']=!S.hid['${k}'];render()"></div><span>${l}</span></div>`).join("")}
<h4>Images (prebuilt, swap any)</h4>${SLOTS.map(([k, l]) => `<div class="im"><img src="${IMG[k]}"><span>${l}</span><button onclick="pick('${k}')">Replace</button>${IMG[k] != DEF[k] ? `<button onclick="IMG['${k}']=DEF['${k}'];render()">Reset</button>` : ""}</div>`).join("")}`;
			}
			function frame() {
				const f = $("#frame");
				f.style.width = S.dev == "m" ? "390px" : "100%";
				f.classList.toggle("m", S.dev == "m");
				panel();
			}
			/* TAB 2 */
			$("#t2").innerHTML = `${hd}
<div class="g" style="margin-top:14px">${fld("Website Link", "https://friendsoffairview.org", { r: 1 })}${fld("Website Title", "Stars & Stripes Flag Program", { r: 1 })}${fld("Group", "HWF Club FOF", { r: 1 })}${fld("Contact Heading", "CONTACT", { r: 1 })}${fld("OTP Email Address", "info@friendsoffairview.org", { r: 1 })}</div>
<div class="row" style="margin-top:12px;gap:22px"><span><b>Display customer support number to club</b> &nbsp;<label style="display:inline;font-weight:400"><input type="radio" name="sp" checked> Yes</label> <label style="display:inline;font-weight:400"><input type="radio" name="sp"> No</label></span></div>
<h3>Site Builder</h3><p class="note">Pick a starting point. Photos, layout and fonts are prebuilt. Your club’s details are filled in from your settings. Click any text to edit it, and click any photo to swap it.</p>
<div class="tpl" id="tpl"></div>
<div class="ed"><div class="tools" id="tools"></div><div class="stage"><div class="frame" id="frame"><div class="chrome"><i></i><i></i><i></i><span>friendsoffairview.org</span></div><div id="site"></div></div></div></div>
<h3>Pay by check &amp; policies</h3><div class="g"><div><label>Pay by Check PDF</label><input type="file" class="f"></div><div><label>Privacy Policy (PDF or Word, under 10 MB)</label><input type="file" class="f"></div><div><label>Admin Header Logo <i>*</i> (185 × 50 px)</label><input type="file" class="f"></div></div>`;
			const tcs = [
				[
					"modern",
					"Modern & Community",
					"Warm neutrals, rounded shapes, photo-led. Friendly and neighborly.",
				],
				[
					"classic",
					"Classic & Patriotic",
					"Serif headlines, navy and red, centered layouts. Traditional and formal.",
				],
			];
			function tplCards() {
				$("#tpl").innerHTML = tcs
					.map(
						([k, n, d]) =>
							`<div class="tc ${S.tpl == k ? "on" : ""}" onclick="S.tpl='${k}';tplCards();render();toast('${n} applied. Your text edits and images are kept')"><img src="${k == "modern" ? DEF.about : DEF.hero}" alt=""><div><b>${n}</b><span class="note">${d}</span></div></div>`,
					)
					.join("");
			}
			tplCards();
			tab(2);
			frame();
			render();
		</script>
	</body>
</html>
