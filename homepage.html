<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Friends of Fairview · Stars &amp; Stripes Flag Program</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Figtree:wght@400..700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@400..700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      padding: 0;
      background: #f4f5f8;
      font-family: Figtree, system-ui, -apple-system, sans-serif;
      color: #1c1d1a;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    /* Demo Navigation Bar */
    .demo-bar {
      position: relative;
      z-index: 99;
      background: #1e293b;
      color: #f8fafc;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }
    .demo-bar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .demo-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #059669;
      color: #fff;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .02em;
      text-transform: uppercase;
    }
    .demo-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }
    .demo-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .demo-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all .15s;
    }
    .demo-btn:hover { background: rgba(255,255,255,.25); color: #fff; }
    .demo-btn.primary { background: #3b82f6; border-color: #3b82f6; }
    .demo-btn.primary:hover { background: #2563eb; }

    /* Site Builder Scoped Preview Styles - Active as Full Public Page */
    .sb-site {
      --d: "Bricolage Grotesque", system-ui, sans-serif;
      --b: Figtree, system-ui, sans-serif;
      --hw: 600;
      --ink: #1c1d1a;
      --mt: #575a53;
      --ln: #e1dbd0;
      --red: #b0532d;
      --base: #faf8f4;
      --sf: #fff;
      --tn: #f0e9dd;
      --r: 20px;
      --br: 999px;
      --ey: none;
      --et: 0;
      --al: left;
      font-family: var(--b);
      color: var(--ink);
      background: var(--base);
      line-height: 1.55;
      container-type: inline-size;
      min-height: 100vh;
    }
    .sb-site.sb-classic {
      --d: "Libre Caslon Text", Georgia, serif;
      --b: "Public Sans", system-ui, sans-serif;
      --hw: 400;
      --ink: #17203a;
      --mt: #4a5163;
      --ln: #d9d2c3;
      --red: #a8322d;
      --base: #f6f3ec;
      --tn: #e7ebf2;
      --r: 2px;
      --br: 2px;
      --ey: uppercase;
      --et: 0.16em;
      --al: center;
    }
    .sb-site h1, .sb-site h2, .sb-site h3 {
      font-family: var(--d);
      font-weight: var(--hw);
      margin: 0;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .sb-site p { margin: 0; }
    .sb-site .s { padding: 72px 6cqw; }
    .sb-site .s.base { background: var(--base); }
    .sb-site .s.sf { background: var(--sf); }
    .sb-site .s.tn { background: var(--tn); }
    .sb-site .s.br { background: var(--brand); color: #fff; --mt: #ffffffcc; --ln: #ffffff33; }
    .sb-site .hd { text-align: var(--al); max-width: 680px; margin: 0 auto 40px 0; }
    .sb-site.sb-classic .hd { margin: 0 auto 40px; }
    .sb-site .hd h2 { font-size: clamp(28px, 4.8cqw, 42px); }
    .sb-site .hd p { color: var(--mt); margin-top: 12px; font-size: 16px; }
    .sb-site .ey { text-transform: var(--ey); letter-spacing: var(--et); font-size: 13px; font-weight: 700; color: var(--red); margin-bottom: 12px; }
    .sb-site .br .ey { color: #f2c8a6; }
    .sb-site .sbtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 26px;
      border-radius: var(--br);
      background: var(--red);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      margin: 8px 10px 0 0;
      cursor: pointer;
      text-decoration: none;
      transition: transform .15s, opacity .15s;
      border: 0;
    }
    .sb-site .sbtn:hover { transform: translateY(-1px); opacity: .94; }
    .sb-site .sbtn.o { background: transparent; border: 1.5px solid #ffffff; color: #ffffff !important; text-decoration: none; transition: all .15s; }
    .sb-site:not(.sb-classic) .sbtn { background: var(--brand); }
    .sb-site .br .sbtn { background: #fff; color: var(--brand); }
    .sb-site .br .sbtn.o { background: transparent; color: #ffffff !important; border-color: #ffffff; }
    .sb-site .hero .sbtn.o, .sb-site.sb-classic .hero .sbtn.o { background: transparent; border: 1.5px solid #ffffff; color: #ffffff !important; }
    .sb-site .hero .sbtn.o:hover, .sb-site.sb-classic .hero .sbtn.o:hover, .sb-site .br .sbtn.o:hover, .sb-site .sbtn.o:hover { background: rgba(255,255,255,.18); color: #ffffff !important; }
    .sb-site .s:not(.br):not(.hero):not(.sb-sec-custom-bg) .sbtn.o { border: 1.5px solid var(--brand); color: var(--brand) !important; }
    .sb-site .s:not(.br):not(.hero):not(.sb-sec-custom-bg) .sbtn.o:hover { background: var(--brand); color: #ffffff !important; }
    
    /* Navigation Bar */
    .sb-site .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 6cqw;
      background: var(--sf);
      border-bottom: 1px solid var(--ln);
      font-size: 14px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 10px rgba(0,0,0,.04);
    }
    .sb-site .nav b { font-family: var(--d); font-size: 18px; }
    .sb-site .nav a { color: var(--mt); text-decoration: none; transition: color .15s; }
    .sb-site .nav a:hover { color: var(--ink); }
    .sb-site .nav .nav-links { display: flex; align-items: center; gap: 20px; }
    .sb-site .nav .nav-login { cursor: pointer; text-decoration: underline; color: var(--mt); }

    /* Hero Section */
    .sb-site .hero {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 6cqw;
      align-items: center;
      padding: 72px 6cqw;
    }
    .sb-site .hero h1 { font-size: clamp(34px, 6.2cqw, 64px); }
    .sb-site .hero p.l { margin: 18px 0 24px; color: var(--mt); font-size: clamp(16px, 1.8cqw, 19px); max-width: 48ch; line-height: 1.6; }
    .sb-site .hero .ph { aspect-ratio: 5/4; border-radius: var(--r); box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    .sb-site.sb-classic .hero { background: var(--brand); color: #fff; text-align: center; grid-template-columns: 1fr; padding: 0; }
    .sb-site.sb-classic .hero .tx { padding: 72px 6cqw 44px; max-width: 820px; margin: 0 auto; }
    .sb-site.sb-classic .hero p.l { color: #ffffffcc; margin: 18px auto 26px; }
    .sb-site.sb-classic .hero .ey { color: #f0c3bb; }
    .sb-site.sb-classic .hero .sbtn { background: var(--red); }
    .sb-site.sb-classic .hero .ph { aspect-ratio: 21/8; border-radius: 0; box-shadow: none; }

    /* Photos */
    .sb-site .ph {
      background-size: cover;
      background-position: center;
      position: relative;
    }

    /* Columns / Cards */
    .sb-site .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
    .sb-site .card {
      background: var(--sf);
      border: 1px solid var(--ln);
      border-radius: var(--r);
      padding: 28px;
      transition: transform .2s, box-shadow .2s;
    }
    .sb-site .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.05); }
    .sb-site .s.sf .card { background: var(--base); }
    .sb-site .br .card { background: #ffffff12; border-color: #ffffff24; }
    .sb-site .card h3 { font-size: 21px; margin-bottom: 10px; }
    .sb-site .card p { color: var(--mt); font-size: 15px; }
    .sb-site .card .n { font-family: var(--d); font-size: 32px; font-weight: var(--hw); color: var(--red); margin-bottom: 8px; }

    /* Split Sections */
    .sb-site .split { display: grid; grid-template-columns: 1fr 1fr; gap: 6cqw; align-items: center; }
    .sb-site .split .ph { aspect-ratio: 4/3; border-radius: var(--r); box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    .sb-site .split.rev .ph { order: 2; }
    .sb-site .split p { color: var(--mt); margin-top: 14px; font-size: 16px; line-height: 1.65; }

    /* Pricing & Holidays */
    .sb-site .price { font-family: var(--d); font-size: 38px; font-weight: var(--hw); margin: 10px 0; }
    .sb-site .price small { font-size: 15px; color: var(--mt); font-family: var(--b); font-weight: normal; }
    .sb-site .hol { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--ln); gap: 14px; }
    .sb-site .hol span { color: var(--mt); font-size: 15px; }
    .sb-site .hol b { font-family: var(--d); font-weight: var(--hw); font-size: 19px; }

    /* Gallery */
    .sb-site .gal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .sb-site .gal .ph { aspect-ratio: 1; border-radius: var(--r); cursor: pointer; transition: transform .2s; }
    .sb-site .gal .ph:hover { transform: scale(1.02); }

    /* Quotes / Testimonials */
    .sb-site .q { font-size: 17px; font-style: var(--qs, normal); line-height: 1.6; }
    .sb-site.sb-classic .q { font-style: italic; }
    .sb-site .who { margin-top: 16px; font-size: 14px; color: var(--mt); }

    /* Map & Contact */
    .sb-site .map { aspect-ratio: 16/10; border-radius: var(--r); box-shadow: 0 8px 24px rgba(0,0,0,.08); }

    /* Footer */
    .sb-site .ft { padding: 48px 6cqw; font-size: 14px; text-align: var(--al); }
    .sb-site .ft b { font-family: var(--d); font-size: 20px; font-weight: var(--hw); display: block; margin-bottom: 10px; }
    .sb-site .ft p { opacity: .85; margin-top: 8px; line-height: 1.6; }

    /* New Section Components: FAQ & CTA */
    .sb-site .faq-list { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .sb-site .faq-item { background: var(--sf); border: 1px solid var(--ln); border-radius: var(--r); padding: 18px 22px; }
    .sb-site .s.sf .faq-item { background: var(--base); }
    .sb-site .faq-q { font-family: var(--d); font-size: 18px; font-weight: var(--hw); color: var(--ink); margin-bottom: 8px; }
    .sb-site .faq-a { color: var(--mt); font-size: 15px; line-height: 1.6; }
    .sb-site .cta-banner { text-align: center; max-width: 780px; margin: 0 auto; padding: 20px 0; }
    .sb-site .cta-banner h2 { font-size: clamp(30px, 5.5cqw, 48px); margin-bottom: 14px; }
    .sb-site .cta-banner p { font-size: 18px; opacity: .9; max-width: 60ch; margin: 0 auto 24px; }

    /* Modular In-Section Elements */
    .sb-sec-elements { margin-top: 36px; display: flex; flex-direction: column; gap: 24px; }
    .sb-el-newsletter { max-width: 580px; margin: 0 auto; background: var(--sf); border: 1px solid var(--ln); border-radius: var(--r); padding: 28px 24px; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.03); }
    .sb-el-newsletter h3 { font-family: var(--d); font-size: 22px; margin-bottom: 8px; }
    .sb-el-newsletter p { font-size: 14px; color: var(--mt); margin-bottom: 18px; line-height: 1.5; }
    .sb-el-newsletter-row { display: flex; gap: 8px; max-width: 440px; margin: 0 auto; }
    .sb-el-newsletter-row input { flex: 1; padding: 11px 16px; border: 1.5px solid var(--ln); border-radius: var(--br); font-size: 14px; outline: none; background: #fff; color: var(--ink); }
    .sb-el-newsletter-row input:focus { border-color: var(--brand); }
    .sb-el-newsletter-row button { border: 0; background: var(--brand); color: #fff; border-radius: var(--br); padding: 11px 20px; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; transition: opacity .15s; }
    .sb-el-newsletter-row button:hover { opacity: .9; }
    .sb-el-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; max-width: 860px; margin: 0 auto; }
    .sb-el-stat-box { background: var(--sf); border: 1px solid var(--ln); border-radius: var(--r); padding: 20px 16px; text-align: center; box-shadow: 0 4px 12px rgba(0,0,0,.02); }
    .sb-el-stat-num { font-family: var(--d); font-size: clamp(28px, 4.5cqw, 40px); font-weight: 800; color: var(--red); line-height: 1.1; margin-bottom: 6px; }
    .sb-el-stat-lbl { font-size: 13px; color: var(--mt); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .sb-el-video { max-width: 760px; margin: 0 auto; border-radius: var(--r); overflow: hidden; background: #0f172a; color: #fff; box-shadow: 0 12px 36px rgba(0,0,0,.15); position: relative; }
    .sb-el-video-preview { aspect-ratio: 16/9; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e293b, #0f172a); position: relative; cursor: pointer; }
    .sb-el-video-play-btn { width: 68px; height: 68px; border-radius: 50%; background: #ef4444; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 6px 20px rgba(239,68,68,.5); transition: transform .2s ease; }
    .sb-el-video:hover .sb-el-video-play-btn { transform: scale(1.12); }
    .sb-el-video-meta { padding: 14px 20px; background: rgba(15,23,42,.92); border-top: 1px solid rgba(255,255,255,.1); }
    .sb-el-video-meta h4 { margin: 0 0 4px; font-size: 15px; font-weight: 700; color: #fff; }
    .sb-el-video-meta p { margin: 0; font-size: 12px; color: #94a3b8; }
    .sb-el-social { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 16px; flex-wrap: wrap; }
    .sb-el-social-link { width: 42px; height: 42px; border-radius: 50%; background: var(--brand); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; text-decoration: none; transition: transform .15s, opacity .15s; }
    .sb-el-social-link:hover { transform: translateY(-2px); opacity: .9; }
    .sb-el-callout { max-width: 720px; margin: 0 auto; background: var(--sf); border-left: 4px solid var(--red); border-top: 1px solid var(--ln); border-right: 1px solid var(--ln); border-bottom: 1px solid var(--ln); border-radius: var(--r); padding: 18px 24px; display: flex; gap: 16px; align-items: flex-start; }
    .sb-el-callout-icon { font-size: 24px; color: var(--red); margin-top: 2px; }
    .sb-el-callout h4 { margin: 0 0 6px; font-size: 17px; font-family: var(--d); }
    .sb-el-callout p { margin: 0; font-size: 14px; color: var(--mt); line-height: 1.5; }
    .sb-el-cta-btn { text-align: center; padding: 12px 0; }
    .sb-el-cta-btn .sbtn { margin: 0 auto; }
    .sb-el-form { max-width: 580px; margin: 0 auto; background: var(--sf); border: 1px solid var(--ln); border-radius: var(--r); padding: 26px; box-shadow: 0 4px 20px rgba(0,0,0,.03); }
    .sb-el-form h3 { font-family: var(--d); font-size: 20px; margin-bottom: 6px; text-align: center; }
    .sb-el-form p { font-size: 13px; color: var(--mt); margin-bottom: 18px; text-align: center; }
    .sb-el-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .sb-el-form input, .sb-el-form textarea { width: 100%; padding: 10px 14px; border: 1.5px solid var(--ln); border-radius: var(--br); font-size: 13px; outline: none; background: #fff; font-family: inherit; }
    .sb-el-form textarea { grid-column: span 2; resize: vertical; min-height: 70px; margin-bottom: 12px; }
    .sb-el-form button { width: 100%; border: 0; background: var(--brand); color: #fff; border-radius: var(--br); padding: 12px 20px; font-weight: 700; font-size: 14px; cursor: pointer; }
    .sb-el-badge { display: flex; align-items: center; justify-content: center; gap: 10px; background: rgba(59,130,246,.08); border: 1px solid rgba(59,130,246,.2); color: var(--brand); padding: 10px 20px; border-radius: 99px; font-size: 13px; font-weight: 700; max-width: max-content; margin: 0 auto; letter-spacing: .02em; }
    .sb-el-quote { max-width: 680px; margin: 0 auto; text-align: center; padding: 24px 20px; }
    .sb-el-quote-text { font-family: var(--d); font-size: clamp(20px, 3.2cqw, 28px); font-weight: var(--hw); line-height: 1.35; margin-bottom: 12px; color: var(--ink); }
    .sb-el-quote-author { font-size: 14px; font-weight: 700; color: var(--red); text-transform: var(--ey); letter-spacing: var(--et); }

    /* Custom Section Styling & Embeds */
    .sb-sec-custom-bg .s, .sb-sec-custom-bg .hero, .sb-sec-custom-bg .cta-banner { background: transparent !important; }
    .sb-sec-outer[style*="color:"] .s, .sb-sec-outer[style*="color:"] .hd h2, .sb-sec-outer[style*="color:"] .hero h1, .sb-sec-outer[style*="color:"] p { color: inherit; }
    .sb-sec-raw { width: 100%; overflow: hidden; }
    .sb-el-custom-html { width: 100%; min-height: 20px; }


    /* Responsive */
    @media (max-width: 860px) {
      .sb-site .hero, .sb-site .split { grid-template-columns: 1fr; }
      .sb-site .split.rev .ph { order: 0; }
      .sb-site .gal { grid-template-columns: repeat(2, 1fr); }
      .sb-site .nav .nav-links { display: none; }
      .demo-bar { flex-direction: column; align-items: flex-start; gap: 8px; }
      .demo-bar-right { width: 100%; justify-content: flex-end; }
    }

    /* Interactive Modal */
    .site-modal-back {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      backdrop-filter: blur(4px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadeIn .15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .site-modal {
      background: #fff;
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0,0,0,.2);
      overflow: hidden;
      animation: slideUp .2s ease;
    }
    @keyframes slideUp { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .site-modal-h {
      padding: 16px 20px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .site-modal-h h3 { margin: 0; font-size: 17px; font-weight: 700; color: #1e293b; }
    .site-modal-x { background: none; border: 0; font-size: 20px; color: #64748b; cursor: pointer; }
    .site-modal-b { padding: 20px; font-size: 14px; color: #334155; }
    .site-modal-b label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
    .site-modal-b input, .site-modal-b select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 14px;
      outline: none;
    }
    .site-modal-b input:focus, .site-modal-b select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
    .site-modal-f {
      padding: 14px 20px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .site-btn {
      padding: 9px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .site-btn.cancel { background: #fff; border-color: #cbd5e1; color: #475569; }
    .site-btn.submit { background: #2563eb; color: #fff; }

    /* Toast */
    .site-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
      z-index: 10001;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(10px);
      transition: all .25s ease;
      pointer-events: none;
    }
    .site-toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <!-- Dynamic Website Mount Point -->
  <main id="site-root" class="sb-site"></main>

  <div id="siteToast" class="site-toast"></div>

  <script>
  (function(){
    // SVG scene library (matches admin Site Builder default library)
    const DEFS = `<defs><filter id="bl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter><filter id="b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="wv" x="-10%" y="-20%" width="125%" height="140%"><feTurbulence type="turbulence" baseFrequency=".008 .026" numOctaves="2" seed="4" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="22"/></filter>
<filter id="ws" x="-10%" y="-20%" width="125%" height="140%"><feTurbulence type="turbulence" baseFrequency=".03 .08" numOctaves="2" seed="4" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="7"/></filter>
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .13 0"/></filter>
<radialGradient id="vg" cx=".5" cy=".5" r=".72"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient>
<radialGradient id="sun"><stop offset="0" stop-color="#fff4cc"/><stop offset=".4" stop-color="#ffd48f" stop-opacity=".55"/><stop offset="1" stop-color="#ffb066" stop-opacity="0"/></radialGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".2" stop-color="#fff" stop-opacity=".2"/><stop offset=".42" stop-color="#000" stop-opacity=".25"/><stop offset=".65" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient>
<linearGradient id="mt" x1="0" x2="1"><stop offset="0" stop-color="#777"/><stop offset=".45" stop-color="#f4f4f4"/><stop offset="1" stop-color="#666"/></linearGradient>
<linearGradient id="lw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#79b563"/><stop offset="1" stop-color="#2f6c35"/></linearGradient>
<linearGradient id="rf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93463e"/><stop offset="1" stop-color="#5d2724"/></linearGradient>
<linearGradient id="rd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e24848"/><stop offset=".6" stop-color="#b52424"/><stop offset="1" stop-color="#7d1414"/></linearGradient>
<pattern id="bk" width="44" height="20" patternUnits="userSpaceOnUse"><rect width="44" height="20" fill="#93503f"/><path d="M0 10H44M22 0V10M0 10V20" stroke="#6c3427" stroke-width="2"/></pattern></defs>`;

    const W = (x, y, w, h) => {
      const u = h / 13;
      let s = "";
      for (let i = 0; i < 13; i++) s += `<rect x="${x}" y="${y + i * u}" width="${w}" height="${u + 0.6}" fill="${i % 2 ? "#f6f6f4" : "#b22234"}"/>`;
      s += `<rect x="${x}" y="${y}" width="${w * 0.4}" height="${u * 7}" fill="#2b2a66"/>`;
      for (let r = 0; r < 5; r++) for (let c = 0; c < 6; c++) s += `<circle cx="${x + (w * 0.4 * (c + 0.5)) / 6}" cy="${y + (u * 7 * (r + 0.5)) / 5}" r="${Math.max(0.7, w * 0.0075)}" fill="#fff"/>`;
      return `<g filter="url(#${w > 110 ? "wv" : "ws"})">${s}<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#sh)"/></g>`;
    };
    const P = (x, y, h, w) => `<rect x="${x - 1.5}" y="${y}" width="${Math.max(2.5, h * 0.014)}" height="${h}" fill="url(#mt)"/><circle cx="${x}" cy="${y - 2}" r="${Math.max(2.5, h * 0.02)}" fill="#e6c46a"/>${W(x + 2, y + 3, w, w * 0.6)}`;
    const sky = (a, b, x = "") => `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="800" height="500" fill="url(#g)"/>${x}`;
    const cl = (x, y, s, o = 0.55) => `<g filter="url(#bl)" fill="#fff" opacity="${o}"><ellipse cx="${x}" cy="${y}" rx="${100 * s}" ry="${17 * s}"/><ellipse cx="${x + 55 * s}" cy="${y - 11 * s}" rx="${62 * s}" ry="${16 * s}"/><ellipse cx="${x - 50 * s}" cy="${y - 6 * s}" rx="${50 * s}" ry="${12 * s}"/></g>`;
    const blades = (c1, c2) => `<g filter="url(#bl)">` + Array.from({ length: 46 }, (_, i) => { const x = i * 18 - 10, h = 40 + ((i * 37) % 50); return `<path d="M${x} 505Q${x + 4} ${505 - h * 0.6} ${x + 10 + (i % 3) * 5} ${505 - h}Q${x + 13} ${505 - h * 0.5} ${x + 18} 505Z" fill="${i % 2 ? c1 : c2}"/>`; }).join("") + `</g>`;
    const crowd = (y, c) => Array.from({ length: 18 }, (_, i) => { const x = i * 46 + 10 + (i % 3) * 8; return `<circle cx="${x}" cy="${y - (i % 4) * 6}" r="${13 + (i % 3) * 2}" fill="${c}"/><rect x="${x - 18}" y="${y + 10 - (i % 4) * 6}" width="36" height="120" rx="16" fill="${c}"/>`; }).join("");
    
    const SC = {
      yard: () => sky("#5f93d0", "#fbc88c", '<circle cx="470" cy="320" r="300" fill="url(#sun)"/>') + cl(150, 90, 1.2, 0.5) + cl(600, 60, 1, 0.4) + `<g filter="url(#bl)" fill="#51724c"><path d="M0 330Q200 270 400 320T800 300V360H0Z"/>${[40, 130, 700, 770].map((x, i) => `<circle cx="${x}" cy="${290 + (i % 2) * 14}" r="${52 + (i % 3) * 8}"/>`).join("")}</g><path d="M0 340Q400 318 800 345V500H0Z" fill="url(#lw)"/>` + [0, 1, 2, 3, 4].map(i => `<polygon points="${i * 170 - 40},500 ${i * 170 + 30},500 ${360 + i * 18},345 ${340 + i * 18},345" fill="#9fd27e" opacity=".14"/>`).join("") + `<polygon points="180,352 540,352 590,372 130,372" fill="#1d3b1d" opacity=".3" filter="url(#bl)"/><rect x="190" y="220" width="340" height="132" fill="#f0e3cd"/>${Array.from({ length: 9 }, (_, i) => `<rect x="190" y="${232 + i * 14}" width="340" height="1.6" fill="#000" opacity=".1"/>`).join("")}<polygon points="165,225 360,130 555,225" fill="url(#rf)"/><rect x="450" y="140" width="28" height="55" fill="#7c4b3d"/><rect x="225" y="250" width="62" height="64" fill="#ffe2a2"/><rect x="223" y="248" width="66" height="68" fill="none" stroke="#fff" stroke-width="5"/><path d="M256 250V314M225 282H287" stroke="#fff" stroke-width="3"/><rect x="433" y="250" width="62" height="64" fill="#ffe2a2"/><rect x="431" y="248" width="66" height="68" fill="none" stroke="#fff" stroke-width="5"/><path d="M464 250V314M433 282H495" stroke="#fff" stroke-width="3"/><rect x="326" y="270" width="68" height="82" rx="3" fill="#5a3426"/><circle cx="384" cy="314" r="3" fill="#e6c46a"/><rect x="300" y="344" width="120" height="10" fill="#d9ccb6"/><g fill="#2f6a3a"><circle cx="215" cy="346" r="22"/><circle cx="250" cy="352" r="18"/><circle cx="470" cy="350" r="20"/><circle cx="505" cy="348" r="24"/></g><g fill="#e85d75"><circle cx="210" cy="342" r="3"/><circle cx="255" cy="350" r="3"/><circle cx="498" cy="342" r="3"/></g><polygon points="640,405 590,420 120,490 330,500 660,420" fill="#102410" opacity=".22" filter="url(#bl)"/>${P(640, 100, 310, 175)}` + blades("#2c5a2e", "#3c7a3a"),
      street: () => sky("#6a9bd6", "#fcd2a0", '<circle cx="400" cy="270" r="280" fill="url(#sun)"/>') + cl(180, 80, 1.1, 0.45) + `<g filter="url(#bl)"><rect y="215" width="800" height="70" fill="#7b8a78"/>${[60, 190, 310, 500, 640, 740].map((x, i) => `<rect x="${x}" y="${200 + (i % 2) * 12}" width="90" height="70" fill="${["#c9b79c", "#a9b6c4", "#d7c2b0"][i % 3]}"/>`).join("")}${[20, 160, 260, 560, 700].map((x, i) => `<circle cx="${x}" cy="${215 + (i % 2) * 10}" r="${44 + (i % 3) * 8}" fill="#3f6b3e"/>`).join("")}</g><rect y="280" width="800" height="220" fill="#78a864"/><polygon points="385,280 415,280 800,500 0,500" fill="#595d63"/><polygon points="395,285 405,285 460,500 340,500" fill="#6b6f76" opacity=".6"/><polygon points="398,290 402,290 412,500 388,500" fill="#e9d777" opacity=".8"/><polygon points="385,280 360,280 0,430 0,500" fill="#a3a8a1"/><polygon points="415,280 440,280 800,430 800,500" fill="#a3a8a1"/>` + [0.2, 0.32, 0.48, 0.68, 0.94].map(f => { const bx = s => 400 + s * -460 * f, by = 280 + 220 * f * 0.82 + 10, h = 30 + 260 * f, w = h * 0.62; return `<g>${P(bx(1) + 8, by - h, h, w)}</g><g>${P(400 - (bx(1) - 400) + 0, by - h, h, w)}</g>`; }).join("") + blades("#28552b", "#3a7438"),
      crew: () => sky("#ff7a52", "#ffe2a8", '<circle cx="400" cy="335" r="360" fill="url(#sun)"/><circle cx="400" cy="335" r="62" fill="#fff6d2"/>') + cl(160, 120, 1.2, 0.35) + cl(640, 150, 1, 0.3) + `<g filter="url(#bl)" fill="#5a4a3a"><path d="M0 360Q200 320 400 350T800 335V400H0Z"/></g><rect y="385" width="800" height="115" fill="#2d3f2c"/><rect y="385" width="800" height="14" fill="#ffb26b" opacity=".3"/>` + [[110, 1], [260, 0], [410, 1], [560, 0], [690, 1]].map(([x, t], i) => { const y = 300 + (i % 2) * 14; return `<g fill="#14182b"><circle cx="${x}" cy="${y}" r="21"/><rect x="${x - 28}" y="${y + 24}" width="56" height="100" rx="22"/><rect x="${x - 24}" y="${y + 110}" width="19" height="90" rx="6"/><rect x="${x + 5}" y="${y + 110}" width="19" height="90" rx="6"/></g><circle cx="${x + 10}" cy="${y - 4}" r="21" fill="#ffb26b" opacity=".18"/>`; }).join("") + blades("#1a2b1c", "#283f2a"),
      truck: () => sky("#ff8a47", "#fdd88d", '<circle cx="580" cy="340" r="320" fill="url(#sun)"/>') + cl(200, 80, 1, 0.4) + `<rect y="365" width="800" height="135" fill="#474747"/><polygon points="210,365 720,365 700,380 180,380" fill="#222" opacity=".4" filter="url(#bl)"/><g><rect x="220" y="240" width="460" height="130" rx="14" fill="url(#rd)"/><rect x="220" y="280" width="460" height="14" fill="#fff" opacity=".9"/><rect x="220" y="302" width="460" height="4" fill="#fff" opacity=".5"/><rect x="520" y="250" width="150" height="60" rx="6" fill="#a4d1f2" opacity=".8"/><rect x="235" y="325" width="260" height="38" rx="6" fill="#a89b94"/><circle cx="310" cy="370" r="44" fill="#1b1c20"/><circle cx="310" cy="370" r="22" fill="#7c8087"/><circle cx="590" cy="370" r="44" fill="#1b1c20"/><circle cx="590" cy="370" r="22" fill="#7c8087"/><rect x="660" y="295" width="22" height="18" rx="4" fill="#ffd043"/></g>` + blades("#303328", "#424838"),
      fire: () => sky("#223356", "#ba5544", '<circle cx="400" cy="280" r="240" fill="url(#sun)"/>') + cl(180, 70, 1.2, 0.25) + `<polygon points="120,440 220,170 380,170 480,440" fill="#f0e2cd"/><polygon points="80,180 300,80 520,180" fill="url(#rf)"/><rect x="230" y="240" width="140" height="190" fill="#4a2c20"/><rect x="0" y="430" width="800" height="70" fill="#303b30"/>${P(580, 180, 250, 140)}` + blades("#1b2e1e", "#28442a"),
      dinner: () => sky("#1f2742", "#c46a48") + `<g filter="url(#bl)"><circle cx="200" cy="140" r="40" fill="#ffe2a4" opacity=".5"/><circle cx="400" cy="120" r="40" fill="#ffe2a4" opacity=".5"/><circle cx="600" cy="140" r="40" fill="#ffe2a4" opacity=".5"/></g><rect y="320" width="800" height="180" fill="#252c3f"/><rect x="100" y="300" width="600" height="30" rx="4" fill="#f5eedc"/><rect x="120" y="330" width="20" height="140" fill="#888"/><rect x="660" y="330" width="20" height="140" fill="#888"/>` + crowd(240, "#121727"),
      map: () => `<path d="M-20 90C150 130 250 20 420 80S720 150 820 70V0H-20Z" fill="#a9d0ee"/><g fill="#bddba3"><ellipse cx="160" cy="400" rx="110" ry="60"/><ellipse cx="640" cy="330" rx="100" ry="70"/><ellipse cx="470" cy="440" rx="70" ry="40"/></g><g stroke="#fff" stroke-linecap="round" fill="none"><path d="M0 190H800M0 345H800M210 0V500M570 0V500" stroke-width="13"/><path d="M0 460L800 40" stroke-width="9"/><path d="M100 0V500M380 0V500M700 0V500M0 270H800M0 100H800M0 425H800" stroke-width="5"/></g><g stroke="#d4d9cc" fill="none" stroke-width="1.5"><path d="M0 190H800M0 345H800M210 0V500M570 0V500"/></g><path d="M160 130L530 95L660 255L590 420L250 430L135 275Z" fill="#d32f2f" opacity=".3" stroke="#c62828" stroke-width="4"/><g font-family="Arial" font-size="15" font-weight="700" fill="#58606a"><text x="300" y="180" opacity=".7">FAIRVIEW</text><text x="600" y="190" opacity=".6" font-size="12">STATE HWY 5</text></g><ellipse cx="400" cy="272" rx="14" ry="5" fill="#000" opacity=".25"/><path d="M400 268c-26-36-26-62 0-62s26 26 0 62z" fill="#c62828"/><circle cx="400" cy="236" r="9" fill="#fff"/>`
    };

    const uri = (k) => "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">${DEFS}${SC[k]()}<rect width="800" height="500" filter="url(#gr)"/><rect width="800" height="500" fill="url(#vg)"/></svg>`);

    const SLOTS = [
      ['hero','Hero photo','yard'],
      ['about','About photo','crew'],
      ['g1','Gallery 1','street'],
      ['g2','Gallery 2','truck'],
      ['g3','Gallery 3','fire'],
      ['g4','Gallery 4','yard'],
      ['dinner','Donation image','dinner'],
      ['map','Service area map','map']
    ];

    const DEF_IMG = {};
    SLOTS.forEach(s => { DEF_IMG[s[0]] = uri(s[2]); });

    // Active State
    let siteState = {
      tpl: 'modern',
      brand: { modern: '#1f4e79', classic: '#1b2a4e' },
      dev: 'd',
      hid: {},
      T: {},
      navBrand: 'Friends of Fairview',
      navLogin: 'Already subscribed? Log in',
      sections: null,
      secOrder: ['hero', 'about', 'how', 'plans', 'hol', 'gal', 'don', 'say', 'contact'],
      IMG: Object.assign({}, DEF_IMG)
    };

    function loadSavedDesign() {
      try {
        const raw = localStorage.getItem('hwf_sitebuilder_design');
        if (!raw) return false;
        const data = JSON.parse(raw);
        if (data.tpl) siteState.tpl = data.tpl;
        if (data.brand) siteState.brand = Object.assign(siteState.brand, data.brand);
        if (data.hid) siteState.hid = Object.assign({}, data.hid);
        if (data.T) siteState.T = Object.assign({}, data.T);
        if (data.navBrand) siteState.navBrand = data.navBrand;
        if (data.navLogin) siteState.navLogin = data.navLogin;
        if (data.sections && Array.isArray(data.sections) && data.sections.length > 0) {
          siteState.sections = data.sections;
        } else if (data.secOrder && Array.isArray(data.secOrder)) {
          siteState.secOrder = data.secOrder;
        }
        if (data.customIMG) {
          for (const k in data.customIMG) {
            siteState.IMG[k] = data.customIMG[k];
          }
        }
        if (data.savedAt) {
          const dt = new Date(data.savedAt);
          const el = document.getElementById('demoSavedTime');
          if (el) el.textContent = `· Synced at ${dt.toLocaleTimeString()}`;
        }
        return true;
      } catch(e) {
        console.error('Failed to load saved design:', e);
        return false;
      }
    }

    // Render Helpers
    const t = (k, fallback) => siteState.T[k] || fallback;
    const ph = (k, cls = "") => {
      const url = (siteState.IMG && siteState.IMG[k]) || (DEF_IMG && DEF_IMG[k]) || (k && k.includes('/') ? k : '');
      return `<div class="ph ${cls}" style="background-image:url('${url}')"></div>`;
    };
    const hdr = (k, ey, title, desc) => `<div class="hd"><div class="ey">${t(k + "e", ey)}</div><h2>${t(k + "t", title)}</h2>${desc ? `<p>${t(k + "p", desc)}</p>` : ""}</div>`;

    function renderElementsHTML(elements, isModern) {
      if (!elements || !Array.isArray(elements) || elements.length === 0) return '';
      return `<div class="sb-sec-elements">` + elements.map(function(el) {
        switch(el.type) {
          case 'newsletter':
            return `
              <div class="sb-el-newsletter">
                <h3>${el.title || 'Subscribe to Our Newsletter'}</h3>
                <p>${el.desc || 'Stay up to date with flag placement schedules, community volunteer days, and first responder events.'}</p>
                <div class="sb-el-newsletter-row">
                  <input type="email" placeholder="${el.placeholder || 'Enter your email address...'}">
                  <button type="button" onclick="showToast('Thank you for subscribing to community updates!')">${el.btn || 'Subscribe'}</button>
                </div>
              </div>`;

          case 'stats':
            return `
              <div class="sb-el-stats">
                ${(el.stats || [
                  { num: '1,450+', lbl: 'Active Flags' },
                  { num: '6', lbl: 'Holidays a Year' },
                  { num: '100%', lbl: 'Volunteer Run' }
                ]).map(function(st) {
                  return `<div class="sb-el-stat-box">
                    <div class="sb-el-stat-num">${st.num}</div>
                    <div class="sb-el-stat-lbl">${st.lbl}</div>
                  </div>`;
                }).join('')}
              </div>`;

          case 'video':
            return `
              <div class="sb-el-video">
                <div class="sb-el-video-preview" onclick="showToast('Playing preview: Memorial Day Flag Placement in Fairview')">
                  <div class="sb-el-video-play-btn"><i class="fa fa-play" style="margin-left:4px"></i></div>
                </div>
                <div class="sb-el-video-meta">
                  <h4>${el.title || 'Watch: 2026 Memorial Day Flag Placement in Fairview'}</h4>
                  <p>${el.desc || 'See our team of neighborhood volunteers placing over 1,400 flags at dawn across Fairview streets.'}</p>
                </div>
              </div>`;

          case 'social':
            return `
              <div class="sb-el-social">
                <a href="#" class="sb-el-social-link" style="background:#1877f2" title="Facebook" onclick="showToast('Opening Facebook page...');return false;"><i class="fa fa-facebook"></i></a>
                <a href="#" class="sb-el-social-link" style="background:#1da1f2" title="Twitter/X" onclick="showToast('Opening Twitter/X...');return false;"><i class="fa fa-twitter"></i></a>
                <a href="#" class="sb-el-social-link" style="background:#e1306c" title="Instagram" onclick="showToast('Opening Instagram...');return false;"><i class="fa fa-instagram"></i></a>
                <a href="#" class="sb-el-social-link" style="background:#ff0000" title="YouTube" onclick="showToast('Opening YouTube channel...');return false;"><i class="fa fa-youtube-play"></i></a>
              </div>`;

          case 'callout':
            return `
              <div class="sb-el-callout">
                <div class="sb-el-callout-icon"><i class="fa ${el.icon || 'fa-info-circle'}"></i></div>
                <div>
                  <h4>${el.title || 'Important Notice for Fairview Residents'}</h4>
                  <p>${el.desc || 'Flag installation begins at 6:30 AM before each holiday. Please ensure front lawn sprinklers are turned off on delivery morning.'}</p>
                </div>
              </div>`;

          case 'cta-btn':
            return `
              <div class="sb-el-cta-btn">
                <button class="sbtn" onclick="openSubscribeModal()">${el.text || 'Subscribe to Holiday Flag Program'}</button>
              </div>`;

          case 'form':
            return `
              <div class="sb-el-form">
                <h3>${el.title || 'Quick Community Inquiry'}</h3>
                <p>${el.desc || 'Have questions about placement, renewal, or corporate sponsorship? Send us a quick note.'}</p>
                <div class="sb-el-form-grid">
                  <input type="text" placeholder="Your Name">
                  <input type="email" placeholder="Email Address">
                  <textarea placeholder="How can we help you?"></textarea>
                </div>
                <button type="button" onclick="showToast('Thank you! Your message has been sent to the volunteer team.')">${el.btn || 'Send Message'}</button>
              </div>`;

          case 'badge':
            return `
              <div class="sb-el-badge">
                <i class="fa fa-shield"></i>
                <span>${el.text || '100% Volunteer Driven · Proud 501(c)(3) Partner · Serving Fairview Since 2018'}</span>
              </div>`;

          case 'quote':
            return `
              <div class="sb-el-quote">
                <div class="sb-el-quote-text">“${el.text || 'The sight of hundreds of American flags flying down our neighborhood streets reminds us what true community is all about.'}”</div>
                <div class="sb-el-quote-author">${el.author || '— CHIEF VOLUNTEER COORDINATOR, FAIRVIEW'}</div>
              </div>`;

          case 'text-block':
            return `
              <div style="max-width:760px;margin:0 auto;padding:12px 20px;text-align:left">
                <h4 style="font-family:var(--d);font-size:20px;margin-bottom:8px">${el.heading || 'Community Notes & Guidelines'}</h4>

              </div>`;

          case 'html':
            return `<div class="sb-el-custom-html">${el.code || ''}</div>`;

          default:
            return '';
        }
      }).join('') + `</div>`;
    }

    function buildSectionFromObject(sec, isModern) {
      const secHdr = function(ey, h, d) {
        return `<div class="hd"><div class="ey">${sec.ey || ey}</div><h2>${sec.heading || h}</h2>${(sec.desc || d) ? `<p>${sec.desc || d}</p>` : ''}</div>`;
      };
      const elementsHTML = renderElementsHTML(sec.elements, isModern);

      const settings = sec.settings || {};
      let secStyle = '';
      let customBgCls = '';
      if (settings.bgColor || settings.bgGradient || settings.bgImg) {
        customBgCls = 'sb-sec-custom-bg';
        if (settings.bgGradient) secStyle += `background:${settings.bgGradient};`;
        else if (settings.bgColor) secStyle += `background-color:${settings.bgColor};`;
        if (settings.bgImg) {
          let overlayCss = '';
          if (settings.bgOverlay === 'dark') overlayCss = 'linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), ';
          else if (settings.bgOverlay === 'dark-heavy') overlayCss = 'linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), ';
          else if (settings.bgOverlay === 'light') overlayCss = 'linear-gradient(rgba(255,255,255,0.7), rgba(255,255,255,0.7)), ';
          secStyle += `background-image:${overlayCss}url('${settings.bgImg}');background-size:cover;background-position:center;`;
          if (settings.bgAttachment === 'fixed') secStyle += `background-attachment:fixed;`;
        }
      }
      if (settings.textColor) secStyle += `color:${settings.textColor};`;
      if (settings.padding) {
        const padMap = { compact: '30px 6cqw', normal: '72px 6cqw', spacious: '110px 6cqw', flush: '0px' };
        secStyle += `padding:${padMap[settings.padding] || settings.padding};`;
      }
      if (settings.maxWidth) {
        secStyle += `max-width:${settings.maxWidth};margin-left:auto;margin-right:auto;`;
      }
      if (settings.inlineStyle) {
        secStyle += settings.inlineStyle.endsWith(';') ? settings.inlineStyle : (settings.inlineStyle + ';');
      }

      if (settings.rawHtml && settings.rawHtml.trim()) {
        return `<div class="sb-sec-outer ${customBgCls} ${settings.customClass || ''}" id="${sec.id || ''}" style="${secStyle}"><div class="s base sb-sec-raw">${settings.rawHtml}</div>${elementsHTML}</div>`;
      }

      let inner = '';
      switch(sec.type) {

          inner = `<div class="s base sb-sec-blank" id="${sec.id || 'sec_blank'}"><div style="text-align:center;max-width:700px;margin:0 auto"><div class="ey">${sec.ey || "Custom Section"}</div><h2>${sec.heading || "Your Custom Section"}</h2><p style="color:var(--mt)">${sec.desc || ""}</p></div>${elementsHTML}</div>`;
          break;

        case 'features':
          inner = `<div class="s sf" id="${sec.id || 'sec_features'}">${secHdr("Why Choose Us", "Built for Our Community", "Premium materials, trusted neighbors, and 100% volunteer dedication.")}<div class="cols">${
            (sec.items || []).map(function(it){
              return `<div class="card">
                <div style="width:44px;height:44px;border-radius:10px;background:rgba(59,130,246,.1);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px">
                  <i class="fa ${it.icon || 'fa-check'}"></i>
                </div>
                <h3>${it.title}</h3>
                <p>${it.desc}</p>
              </div>`;
            }).join('')
          }</div>${elementsHTML}</div>`;
          break;

        case 'stats':
          inner = `<div class="s tn" id="${sec.id || 'sec_stats'}"><div class="hd" style="text-align:center;margin:0 auto 36px"><div class="ey">${sec.ey || "Our Impact"}</div><h2>${sec.heading || "Serving Fairview with Pride"}</h2>${sec.desc ? `<p>${sec.desc}</p>` : ''}</div><div class="cols">${
            (sec.items || []).map(function(it){
              return `<div class="card" style="text-align:center">
                <div class="n" style="font-size:clamp(32px,5cqw,46px)">${it.num || it.number || ''}</div>

        case 'about':

          break;

        case 'cta':
          inner = `<div class="s br" id="cta"><div class="cta-banner"><div class="ey">${sec.ey || "Get Started Today"}</div><h2>${sec.heading || "Ready to join our community flag program?"}</h2><p>${sec.desc || "Sign up in two minutes. Support Fairview first responders and show pride on every major holiday."}</p><div><button class="sbtn" onclick="openSubscribeModal()">${sec.btn1 || "Subscribe now"}</button>${sec.btn2 ? `<button class="sbtn o" onclick="openManageModal()">${sec.btn2}</button>` : ''}</div></div>${elementsHTML}</div>`;
          break;

          inner = `<div class="s sf" id="holidays">${secHdr("Schedule", "Holidays we fly", "Flags are installed the day before and retrieved the day after each date.")}<div style="max-width:680px;margin:0 auto">${
            (sec.items || []).map(it => `<div class="hol"><b>${it.name}</b><span>${it.date}</span></div>`).join('')
          }</div>${elementsHTML}</div>`;
          break;

        case 'gal':
          inner = `<div class="s sf" id="gallery">${secHdr("Flag days", "Around Fairview", "")}<div class="gal">${
            (sec.items || []).map(k => ph(k)).join('')

          inner = `<div class="s tn" id="contact"><div class="split"><div><div class="ey">${sec.ey || "Contact"}</div><h2 style="font-size:clamp(26px,4.4cqw,38px)">${sec.heading || "Questions? We’re happy to help."}</h2><p style="margin-bottom:14px">${sec.desc || "Note: Please check the service map to verify we service your address."}</p><div style="color:var(--ink);line-height:1.8">${sec.details || "<b>Friends of Fairview</b><br>(469) 331-2520<br>SMS: (972) 968-8140. Text us, it’s faster and easier.<br>510 State HWY 5, Fairview, TX 75069<br>info@friendsoffairview.org"}</div><div style="margin-top:20px"><button class="sbtn" onclick="openSubscribeModal()">Get Started</button></div></div>${ph(sec.img || 'map', 'map')}</div>${sec.footerNote ? `<p class="who" style="margin-top:14px;text-align:center">${sec.footerNote}</p>` : ''}${elementsHTML}</div>`;
          break;

        case 'don':
          inner = `<div class="s br" id="dinner"><div class="split">${ph(sec.img || 'dinner')}<div><div class="ey">${sec.ey || "Additional donation"}</div><h2 style="font-size:clamp(26px,4.4cqw,38px)">${sec.heading || "First Responders Appreciation Dinner"}</h2><p>${sec.desc || "Each year, we host an Appreciation Dinner to honor all of Fairview’s first responders (Police, Fire and EMS), and we’d be grateful for your support."}</p><button class="sbtn" onclick="openDonateModal()">${sec.btn1 || "Donate"}</button><a href="#" class="sbtn o" onclick="showToast('Annual Appreciation Dinner PDF flyer will download');return false;">${sec.btn2 || "Read more (PDF)"}</a></div></div>${elementsHTML}</div>`;

    function renderPage() {
      const root = document.getElementById('site-root');
      const isModern = siteState.tpl === 'modern';
      const brandColor = siteState.brand[siteState.tpl] || (isModern ? '#1f4e79' : '#1b2a4e');

      root.className = 'sb-site ' + (siteState.tpl === 'classic' ? 'sb-classic' : '');
      root.style.setProperty('--brand', brandColor);

      const navHTML = `
        <header class="nav">
          <b>${siteState.navBrand || t("nb", "Friends of Fairview")}</b>
          <div class="nav-links">
            <a href="#about">About</a>
            <a href="#how">How It Works</a>
            <a href="#plans">Plans</a>
            <a href="#holidays">Holidays</a>
            <a href="#gallery">Gallery</a>
            <a href="#contact">Contact</a>
          </div>
          <div>
            <span class="nav-login" onclick="openManageModal()">${siteState.navLogin || t("nl", "Already subscribed? Log in")}</span>
            <button class="sbtn" style="padding:8px 18px;margin-left:14px;font-size:13px" onclick="openSubscribeModal()">${t("hb", "Subscribe")}</button>
          </div>
        </header>
      `;

      let sectionsHTML = '';
      if (siteState.sections && Array.isArray(siteState.sections) && siteState.sections.length > 0) {
        sectionsHTML = siteState.sections
          .filter(sec => !sec.hidden)
          .map(sec => buildSectionFromObject(sec, isModern))
          .join("");
      } else {
        const order = siteState.secOrder || ['hero', 'about', 'how', 'plans', 'hol', 'gal', 'don', 'say', 'contact'];
        sectionsHTML = order
          .filter(k => !siteState.hid[k])
          .map(k => buildSectionHTML(k, isModern))
          .join("");
      }

      const footerHTML = `
        <footer class="ft s br">
          <b>Friends of Fairview Fire Fighters Association</b>
          <p>info@friendsoffairview.org · (469) 331-2520 · 510 State HWY 5, Fairview, TX 75069</p>
          <p>Privacy policy · Terms of service · Recurring billing &amp; cancellation · Donation refund policy</p>
          <p>© 2026 Friends of Fairview · Powered by Helping With Flags</p>
        </footer>
      `;

      root.innerHTML = navHTML + sectionsHTML + footerHTML;

      const bMod = document.getElementById('btnTplModern');
      const bCls = document.getElementById('btnTplClassic');
      if (bMod && bMod.classList) bMod.classList.toggle('primary', isModern);
      if (bCls && bCls.classList) bCls.classList.toggle('primary', !isModern);
    }

    window.setTemplate = function(tplKey) {
      siteState.tpl = tplKey;
      try {
        const raw = localStorage.getItem('hwf_sitebuilder_design');
        let data = raw ? JSON.parse(raw) : {};
        data.tpl = tplKey;
        localStorage.setItem('hwf_sitebuilder_design', JSON.stringify(data));
      } catch(e){}
      renderPage();
      showToast((tplKey === 'classic' ? 'Classic & Patriotic' : 'Modern & Community') + ' template active');
    };

          <div class="site-modal-h">
            <h3>Subscriber Login (Passwordless)</h3>
            <button class="site-modal-x" onclick="closeModal()">×</button>
          </div>
          <div class="site-modal-b">
            <p style="margin-bottom:14px;color:#64748b">Enter the email you used when subscribing. We'll send a one-time sign-in link or 6-digit code.</p>
            <label>Subscriber Email Address</label>
            <input type="email" id="loginEmail" value="info@webcodegenie.net">
          </div>
          <div class="site-modal-f">
            <button type="button" class="site-btn cancel" onclick="closeModal()">Cancel</button>
            <button type="button" class="site-btn submit" onclick="submitLogin()">Send Sign-in Code</button>
          </div>
        </div>
      `;
      document.body.appendChild(div);
      div.addEventListener('click', e => { if (e.target === div) closeModal(); });
    };

    window.submitLogin = function() {
      const email = document.getElementById('loginEmail').value;
      closeModal();
      showToast(`Sign-in code sent to ${email}. Check your inbox!`);
    };

    window.openDonateModal = function() {
      closeModal();
      const div = document.createElement('div');
      div.className = 'site-modal-back';
      div.id = 'siteModalBack';
      div.innerHTML = `
        <div class="site-modal">
          <div class="site-modal-h">
            <h3>First Responders Appreciation Dinner Donation</h3>
            <button class="site-modal-x" onclick="closeModal()">×</button>
          </div>
          <div class="site-modal-b">
            <p style="margin-bottom:14px;color:#64748b">Support Fairview's Fire, Police, and EMS personnel at our annual community dinner.</p>
            <label>Donation Amount</label>
            <select id="donAmount">
              <option>$25 · Single Meal Sponsorship</option>
              <option selected>$50 · Table Supporter</option>
              <option>$100 · Hero Sponsorship</option>
              <option>$250 · Department Benefactor</option>
            </select>
            <label>Donor Name (or Business)</label>
            <input type="text" id="donName" value="Friends of Community">
          </div>
          <div class="site-modal-f">
            <button type="button" class="site-btn cancel" onclick="closeModal()">Cancel</button>
            <button type="button" class="site-btn submit" onclick="submitDonation()">Donate Now</button>
          </div>
        </div>
      `;
      document.body.appendChild(div);
      div.addEventListener('click', e => { if (e.target === div) closeModal(); });
    };

    window.submitDonation = function() {
      const amt = document.getElementById('donAmount').value;
      closeModal();
      showToast(`Thank you for your generous ${amt} donation to our first responders!`);
    };

    let toastTimer;
    window.showToast = function(msg) {
      const t = document.getElementById('siteToast');
      t.innerHTML = `<i class="fa fa-check-circle" style="color:#10b981;font-size:16px"></i> ${msg}`;
      t.className = 'site-toast show';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.className = 'site-toast'; }, 3600);
    };

    // Auto-listen to localStorage changes from Admin Site Builder tab!
    window.addEventListener('storage', function(e) {
      if (e.key === 'hwf_sitebuilder_design') {
        loadSavedDesign();
        renderPage();
        showToast('Site design updated in real-time from Site Builder!');
      }
    });

    // Initial render
    loadSavedDesign();
    renderPage();
  })();
  </script>
</body>
</html>
